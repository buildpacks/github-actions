name: Action buildpack-compute-metadata
"on":
  pull_request:
    paths:
    - .github/workflows/action-buildpack-compute-metadata.yml
    - buildpack/compute-metadata/**
    - Dockerfile
    - go.mod
    - go.sum
    - internal/**
  push:
    branches:
    - main
    - test
    paths:
    - .github/workflows/action-buildpack-compute-metadata.yml
    - buildpack/compute-metadata/**
    - Dockerfile
    - go.mod
    - go.sum
    - internal/**
  release:
    types:
    - published
jobs:
  create-action:
    name: Create Action
    runs-on:
    - ubuntu-latest
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.repository == 'buildpacks/github-actions' }}
    steps:
    - if:   ${{ env.PUSH == 'true' }}
      name: Docker login ghcr.io
      uses: docker/login-action@v4.6.0
      with:
        password: ${{ secrets.IMPLEMENTATION_GITHUB_TOKEN }}
        registry: ghcr.io
        username: ${{ secrets.IMPLEMENTATION_GITHUB_USERNAME }}
    - uses: actions/checkout@v7
    - id:   version
      name: Compute Version
      run:  |
            #!/usr/bin/env bash

            set -euo pipefail

            if [[ ${GITHUB_REF} =~ refs/tags/v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              VERSION=${BASH_REMATCH[1]}
            elif [[ ${GITHUB_REF} =~ refs/heads/(.+) ]]; then
              VERSION=${BASH_REMATCH[1]}
            else
              VERSION=$(git rev-parse --short HEAD)
            fi

            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Selected ${VERSION} from
              * ref: ${GITHUB_REF}
              * sha: ${GITHUB_SHA}
            "
    - name: Create Action
      run:  |
            #!/usr/bin/env bash

            set -euo pipefail

            echo "::group::Building ${TARGET}:${VERSION}"
              docker build \
                --file Dockerfile \
                --build-arg "SOURCE=${SOURCE}" \
                --build-arg "GO_VERSION=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' go.mod)" \
                --tag "${TARGET}:${VERSION}" \
                .
            echo "::endgroup::"

            if [[ "${PUSH}" == "true" ]]; then
              echo "::group::Pushing ${TARGET}:${VERSION}"
                docker push "${TARGET}:${VERSION}"
              echo "::endgroup::"
            else
              echo "Skipping push"
            fi
      env:
        SOURCE:  buildpack/compute-metadata/cmd
        TARGET:  ghcr.io/buildpacks/actions/buildpack/compute-metadata
        VERSION: ${{ steps.version.outputs.version }}
